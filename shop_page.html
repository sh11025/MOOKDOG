<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>묵독 MOOKDOG - 상품 상세</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Pretendard", "sans-serif"],
              serif: ["Noto Serif KR", "serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-[#fbf9f9] text-[#1b1c1c] font-sans antialiased min-h-screen flex flex-col">
    <!-- 네비게이션 바 -->
    <nav class="sticky top-0 z-50 bg-[#fbf9f9] h-20 border-b border-black px-4 md:px-12 flex justify-between items-center">
      <div class="flex items-center gap-8">
        <a href="main_page.html" class="block">
          <img src="image/logo.png" alt="묵독 MOOKDOG" class="h-12 w-auto object-contain" />
        </a>
        <div class="hidden md:flex gap-6 text-xs font-semibold uppercase tracking-wider">
          <a href="main_page.html" class="text-neutral-500 hover:text-black transition-colors">홈</a>
          <a href="sub_page.html" class="text-black border-b-2 border-black pb-1">카탈로그</a>
          <a href="main_page.html" class="text-neutral-500 hover:text-black transition-colors">큐레이션</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="relative hidden md:block">
          <input
            id="detail-search-input"
            type="text"
            placeholder="도서 검색..."
            onkeydown="if(event.key === 'Enter'){ window.location.href='sub_page.html?search=' + encodeURIComponent(this.value); }"
            class="border-b border-black bg-transparent py-1 pr-8 text-sm focus:outline-none placeholder:text-neutral-500 w-40 focus:w-56 transition-all"
          />
          <span class="material-symbols-outlined absolute right-0 top-1 text-sm text-black cursor-pointer">search</span>
        </div>
        <button onclick="openCart()" class="relative hover:text-neutral-500 transition-colors" title="장바구니 확인">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </nav>

    <!-- 상세 페이지 메인 콘텐츠 -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-12 py-12 md:py-20">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-20 items-start">
        <div class="lg:col-span-7 flex flex-col md:flex-row gap-6">
          <div class="flex md:flex-col gap-3 order-2 md:order-1" id="thumbnail-list">
            <button type="button" onclick="changeImage(this)" class="thumbnail-item w-16 h-24 border-2 border-black opacity-100 p-1 focus:outline-none transition-all bg-white overflow-hidden">
              <img id="thumb-1" class="w-full h-full object-cover" src="" alt="도서 표지" />
            </button>
            <button type="button" onclick="changeImage(this)" class="thumbnail-item w-16 h-24 border border-neutral-300 opacity-60 hover:opacity-100 p-1 focus:outline-none transition-all bg-white overflow-hidden">
              <img id="thumb-2" class="w-full h-full object-cover" src="" alt="도서 측면" />
            </button>
            <button type="button" onclick="changeImage(this)" class="thumbnail-item w-16 h-24 border border-neutral-300 opacity-60 hover:opacity-100 p-1 focus:outline-none transition-all bg-white overflow-hidden">
              <img id="thumb-3" class="w-full h-full object-cover" src="" alt="도서 후면" />
            </button>
            <button type="button" onclick="changeImage(this)" class="thumbnail-item w-16 h-24 border border-neutral-300 opacity-60 hover:opacity-100 p-1 focus:outline-none transition-all bg-white overflow-hidden">
              <img id="thumb-4" class="w-full h-full object-cover" src="" alt="도서 내지" />
            </button>
          </div>
          <div class="flex-grow border border-black order-1 md:order-2 bg-white p-8 flex justify-center items-center min-h-[420px]">
            <img id="detail-cover" class="w-full max-w-[340px] aspect-[2/3] object-cover shadow-sm transition-all duration-300" src="" alt="도서 커버" />
          </div>
        </div>

        <!-- 주문 패널 -->
        <div class="lg:col-span-5 sticky top-28 pl-0 lg:pl-6 flex flex-col gap-6">
          <div>
            <span id="detail-publisher" class="text-xs uppercase font-semibold text-neutral-500 tracking-wider"></span>
            <h1 id="detail-title" class="font-serif text-3xl md:text-4xl font-bold mt-1 mb-2">도서 정보 불러오는 중...</h1>
            <p id="detail-author" class="text-base text-neutral-600"></p>
          </div>

          <div class="flex items-center gap-2">
            <div id="detail-star-icons" class="flex text-[#c56b4f]"></div>
            <span id="detail-rating-text" class="text-xs text-neutral-600 font-semibold"></span>
          </div>

          <div id="detail-price" class="font-serif text-2xl font-bold">₩0</div>

          <!-- 포맷 선택 -->
          <div class="space-y-3">
            <span class="text-xs font-semibold uppercase tracking-wider block">포맷</span>
            <div class="flex gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="format" value="종이책" class="peer sr-only" checked onchange="updateFormat(this.value)" />
                <div class="px-5 py-2.5 border border-neutral-400 bg-transparent text-neutral-600 text-xs font-semibold uppercase transition-colors hover:border-black hover:text-black peer-checked:bg-black peer-checked:text-white peer-checked:border-black">종이책</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="format" value="전자책" class="peer sr-only" onchange="updateFormat(this.value)" />
                <div class="px-5 py-2.5 border border-neutral-400 bg-transparent text-neutral-600 text-xs font-semibold uppercase transition-colors hover:border-black hover:text-black peer-checked:bg-black peer-checked:text-white peer-checked:border-black">전자책</div>
              </label>
            </div>
          </div>

          <!-- 수량 및 담기 버튼 -->
          <div class="flex items-center gap-4">
            <div class="flex items-center border border-black">
              <button type="button" onclick="decreaseQuantity()" class="px-3 py-2 hover:bg-neutral-100"><span class="material-symbols-outlined text-sm">remove</span></button>
              <span id="quantity-value" class="w-8 text-center text-sm font-medium select-none">1</span>
              <button type="button" onclick="increaseQuantity()" class="px-3 py-2 hover:bg-neutral-100"><span class="material-symbols-outlined text-sm">add</span></button>
            </div>
            <button onclick="handleDetailAddToCart()" class="flex-grow bg-black text-white text-xs font-semibold uppercase py-3.5 border border-black hover:bg-white hover:text-black transition-colors text-center">장바구니 담기</button>
          </div>

          <div class="border-t border-black pt-4">
            <p class="text-sm text-neutral-600 leading-relaxed">₩50,000 이상 주문 시 무료 배송. 영업일 기준 1-2일 내 발송.</p>
          </div>
        </div>
      </div>

      <!-- 하단 탭 메뉴 -->
      <div class="border-t border-black pt-12">
        <div class="flex gap-8 border-b border-neutral-300 mb-10 overflow-x-auto text-xs font-semibold uppercase tracking-wider">
          <button onclick="switchTab('synopsis', this)" class="tab-btn border-b-2 border-black text-black pb-3 whitespace-nowrap transition-colors">도서 소개</button>
          <button onclick="switchTab('author', this)" class="tab-btn border-b-2 border-transparent text-neutral-500 hover:text-black pb-3 whitespace-nowrap transition-colors">저자 정보</button>
          <button onclick="switchTab('specs', this)" class="tab-btn border-b-2 border-transparent text-neutral-500 hover:text-black pb-3 whitespace-nowrap transition-colors">상세 사양</button>
          <button id="tab-btn-reviews" onclick="switchTab('reviews', this)" class="tab-btn border-b-2 border-transparent text-neutral-500 hover:text-black pb-3 whitespace-nowrap transition-colors">리뷰</button>
        </div>

        <div id="tab-synopsis" class="tab-panel space-y-4 max-w-3xl">
          <h3 class="font-serif text-xl font-bold">책 소개</h3>
          <p id="detail-contents" class="text-neutral-600 leading-relaxed text-sm md:text-base whitespace-pre-line"></p>
        </div>

        <div id="tab-author" class="tab-panel hidden space-y-4 max-w-2xl">
          <h3 id="tab-author-name" class="font-serif text-xl font-bold"></h3>
          <p class="text-neutral-600 leading-relaxed text-sm md:text-base">저자 상세 정보는 출판사 및 국립중앙도서관 제공 데이터를 기반으로 표기됩니다.</p>
        </div>

        <div id="tab-specs" class="tab-panel hidden max-w-xl">
          <dl class="divide-y divide-neutral-200 text-sm">
            <div class="py-3 flex justify-between"><dt class="font-semibold text-neutral-700">ISBN</dt><dd id="tab-spec-isbn" class="text-neutral-600"></dd></div>
            <div class="py-3 flex justify-between"><dt class="font-semibold text-neutral-700">출판사</dt><dd id="tab-spec-publisher" class="text-neutral-600"></dd></div>
            <div class="py-3 flex justify-between"><dt class="font-semibold text-neutral-700">출간일</dt><dd id="tab-spec-date" class="text-neutral-600"></dd></div>
          </dl>
        </div>

        <div id="tab-reviews" class="tab-panel hidden space-y-6 max-w-3xl">
          <div id="reviews-container" class="space-y-6"></div>
        </div>
      </div>
    </main>

    <!-- 푸터 -->
    <footer class="w-full py-10 px-4 md:px-12 mt-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-t border-black bg-[#fbf9f9]">
      <img src="image/logo.png" alt="묵독 MOOKDOG" class="h-10 w-auto object-contain" />
      <div class="flex flex-wrap gap-6 text-xs uppercase tracking-wider text-neutral-600">
        <a href="main_page.html" class="hover:text-black transition-colors">소개</a>
        <a href="main_page.html" class="hover:text-black transition-colors">배송</a>
        <a href="main_page.html" class="hover:text-black transition-colors">개인정보처리방침</a>
        <a href="main_page.html" class="hover:text-black transition-colors">인스타그램</a>
      </div>
      <div class="text-xs text-neutral-500">© 2024 MOOKDOG. 모든 권리 보유.</div>
    </footer>

    <!-- 토스트 알림 -->
    <div id="toast" class="fixed bottom-8 right-8 z-[70] translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-[#1b1c1c] text-white px-5 py-4 border border-black shadow-2xl flex items-center gap-4 max-w-sm">
      <span class="material-symbols-outlined text-green-400 text-lg">check_circle</span>
      <div class="flex-grow">
        <p id="toast-title" class="text-xs font-bold font-serif line-clamp-1"></p>
        <p class="text-[11px] text-neutral-300">장바구니에 추가되었습니다.</p>
      </div>
      <button type="button" onclick="openCart(); hideToast();" class="text-[11px] font-semibold uppercase tracking-wider underline hover:text-neutral-300 pointer-events-auto">장바구니 보기</button>
    </div>

    <!-- 장바구니 드로어 -->
    <div id="cart-drawer" class="fixed right-0 top-0 h-full z-[60] bg-[#fbf9f9] border-l border-black w-full md:w-96 translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
      <div class="flex justify-between items-center p-5 border-b border-black">
        <h2 class="font-serif text-xl font-bold">장바구니</h2>
        <button onclick="closeCart()" class="text-black hover:text-neutral-500"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div id="cart-items-container" class="flex-grow overflow-y-auto p-5 space-y-4"></div>
      <div class="border-t border-black p-5 bg-[#fbf9f9]">
        <div class="flex justify-between mb-4 font-serif text-lg font-bold"><span>합계</span><span id="cart-total-price">₩0</span></div>
        <button onclick="proceedToCheckoutFromCart()" class="block w-full bg-black text-white text-xs font-semibold uppercase py-4 border border-black text-center hover:bg-white hover:text-black transition-colors">주문하기</button>
      </div>
    </div>
    <div id="cart-overlay" onclick="closeCart()" class="fixed inset-0 bg-black/40 z-[55] hidden transition-opacity opacity-0 backdrop-blur-sm"></div>

    <!-- 3단계 결제 모달 -->
    <div id="checkoutModal" class="fixed inset-0 z-[100] hidden">
      <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeCheckout()"></div>
      <div class="relative min-h-screen flex justify-center items-center p-4">
        <div class="bg-[#fbf9f9] border border-black w-full max-w-xl shadow-xl z-10">
          <div class="flex justify-between items-center p-5 border-b border-black">
            <h2 class="font-serif text-2xl font-bold">결제</h2>
            <button onclick="closeCheckout()" class="hover:text-neutral-500"><span class="material-symbols-outlined">close</span></button>
          </div>
          <div class="p-6 md:p-8">
            <div class="flex gap-4 mb-8 text-xs font-semibold uppercase">
              <div id="step-tab-1" class="flex-1 border-b-2 border-black pb-2 text-black transition-colors">1. 배송</div>
              <div id="step-tab-2" class="flex-1 border-b-2 border-neutral-300 pb-2 text-neutral-400 transition-colors">2. 결제</div>
              <div id="step-tab-3" class="flex-1 border-b-2 border-neutral-300 pb-2 text-neutral-400 transition-colors">3. 검토</div>
            </div>

            <div id="step-content-1" class="space-y-5">
              <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs uppercase font-semibold mb-1">이름</label><input type="text" placeholder="홍길동" class="w-full bg-transparent border-0 border-b border-black py-2 text-sm focus:ring-0 focus:outline-none" /></div>
                <div><label class="block text-xs uppercase font-semibold mb-1">연락처</label><input type="text" placeholder="010-1234-5678" class="w-full bg-transparent border-0 border-b border-black py-2 text-sm focus:ring-0 focus:outline-none" /></div>
              </div>
              <div><label class="block text-xs uppercase font-semibold mb-1">주소</label><input type="text" placeholder="배송지 주소를 입력하세요" class="w-full bg-transparent border-0 border-b border-black py-2 text-sm focus:ring-0 focus:outline-none" /></div>
              <div class="pt-4"><button type="button" onclick="goToStep(2)" class="w-full bg-black text-white text-xs font-semibold uppercase py-4 border border-black hover:bg-white hover:text-black transition-colors">결제 수단 선택으로</button></div>
            </div>

            <div id="step-content-2" class="space-y-5 hidden">
              <div class="space-y-2">
                <label class="flex items-center gap-3 p-3 border border-black cursor-pointer bg-white"><input type="radio" name="paymentMethod" checked class="accent-black" /><span class="text-sm font-medium">신용/체크카드</span></label>
                <label class="flex items-center gap-3 p-3 border border-neutral-300 cursor-pointer hover:border-black"><input type="radio" name="paymentMethod" class="accent-black" /><span class="text-sm font-medium">간편결제 (카카오페이 / 네이버페이)</span></label>
              </div>
              <div class="flex gap-3 pt-4">
                <button type="button" onclick="goToStep(1)" class="w-1/3 bg-transparent text-black text-xs font-semibold uppercase py-4 border border-black hover:bg-neutral-100">이전</button>
                <button type="button" onclick="goToStep(3)" class="w-2/3 bg-black text-white text-xs font-semibold uppercase py-4 border border-black hover:bg-white hover:text-black">최종 확인으로</button>
              </div>
            </div>

            <div id="step-content-3" class="space-y-5 hidden">
              <div class="bg-neutral-100 p-4 border border-neutral-300 space-y-2 text-sm">
                <div class="flex justify-between font-semibold"><span>상품 합계</span><span id="modal-summary-price">₩0</span></div>
                <div class="flex justify-between text-neutral-600 text-xs"><span>배송비</span><span>무료</span></div>
                <div class="border-t border-neutral-300 pt-2 flex justify-between font-bold text-base"><span>총 결제금액</span><span id="modal-total-price">₩0</span></div>
              </div>
              <div class="flex gap-3 pt-4">
                <button type="button" onclick="goToStep(2)" class="w-1/3 bg-transparent text-black text-xs font-semibold uppercase py-4 border border-black hover:bg-neutral-100">이전</button>
                <button type="button" onclick="completeOrder()" class="w-2/3 bg-black text-white text-xs font-semibold uppercase py-4 border border-black hover:bg-white hover:text-black">주문 완료하기</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/cart.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
